<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Astral Bloom</title>
  <desc id="desc">A gold celestial flower beside the Astral Bloom wordmark on a deep navy background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1e3f"/>
      <stop offset="1" stop-color="#213a56"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7df9b"/>
      <stop offset="0.5" stop-color="#cdaa80"/>
      <stop offset="1" stop-color="#997953"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.6" stop-color="#eab308"/>
      <stop offset="1" stop-color="#997953"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="280" rx="34" fill="url(#bg)"/>
  <path d="M36 48C164 4 302 24 410 76C526 132 632 110 752 54C826 20 890 24 924 38" fill="none" stroke="#cdaa80" stroke-opacity=".12" stroke-width="2"/>
  <path d="M44 238C160 198 278 214 386 244C500 276 650 254 772 202C840 172 892 178 926 194" fill="none" stroke="#cdaa80" stroke-opacity=".1" stroke-width="2"/>

  <g transform="translate(144 140)">
    <circle r="82" fill="#071127" stroke="#cdaa80" stroke-opacity=".55" stroke-width="2"/>
    <circle r="69" fill="none" stroke="#cdaa80" stroke-opacity=".18"/>
    <g fill="url(#gold)" opacity=".95">
      <ellipse rx="18" ry="47" transform="rotate(0) translate(0 -40)"/>
      <ellipse rx="18" ry="47" transform="rotate(60) translate(0 -40)"/>
      <ellipse rx="18" ry="47" transform="rotate(120) translate(0 -40)"/>
      <ellipse rx="18" ry="47" transform="rotate(180) translate(0 -40)"/>
      <ellipse rx="18" ry="47" transform="rotate(240) translate(0 -40)"/>
      <ellipse rx="18" ry="47" transform="rotate(300) translate(0 -40)"/>
    </g>
    <circle r="25" fill="url(#core)" filter="url(#glow)"/>
    <circle r="8" fill="#fff7d6"/>
    <g fill="#f7df9b">
      <path d="M-72-66l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
      <path d="M73-48l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z"/>
      <circle cx="-77" cy="56" r="3"/>
      <circle cx="69" cy="65" r="2.5"/>
    </g>
  </g>

  <g transform="translate(268 0)">
    <text x="0" y="136" fill="#f9fafb" font-family="Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="10">ASTRAL BLOOM</text>
    <line x1="2" y1="158" x2="614" y2="158" stroke="url(#gold)" stroke-width="2"/>
    <text x="4" y="197" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="5">CELESTIAL BOUQUETS · WARSAW</text>
  </g>
</svg>
